  <text x="67" y="310" font-family="Arial,sans-serif" font-size="14" fill="#D8E5EB">Solar Hijri + Gregorian</text>
  <circle cx="279" cy="305" r="3" fill="#F77700"/>
  <text x="291" y="310" font-family="Arial,sans-serif" font-size="14" fill="#D8E5EB">RTL / LTR</text>
  <circle cx="387" cy="305" r="3" fill="#F77700"/>
  <text x="401" y="310" font-family="Arial,sans-serif" font-size="14" fill="#D8E5EB">ISO dates</text>
