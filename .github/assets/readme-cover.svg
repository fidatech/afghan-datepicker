  <circle cx="1130" cy="330" r="220" fill="#D7E9F4" opacity=".06"/>
  <rect x="65" y="43" width="183" height="30" rx="15" fill="#F77700" fill-opacity=".14" stroke="#FF9839" stroke-opacity=".48"/>
  <circle cx="83" cy="58" r="4" fill="#F77700"/>
  <text x="100" y="63" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#FFC38C">OPEN SOURCE · MIT</text>
  <text x="65" y="145" font-family="Arial,sans-serif" font-size="51" letter-spacing="-1.2" font-weight="700" fill="#FFFFFF">Dates that speak</text>
  <text x="65" y="202" font-family="Arial,sans-serif" font-size="51" letter-spacing="-1.2" font-weight="700" fill="#FF8B20">your language.</text>
  <text x="67" y="248" font-family="Arial,sans-serif" font-size="17" fill="#BDD0DC">Pashto  ·  Dari  ·  Persian  ·  English</text>
