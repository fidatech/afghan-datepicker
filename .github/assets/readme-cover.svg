<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">Afghan Datepicker — dates that speak your language</title>
  <desc id="description">Navy and orange branded calendar illustration with a Gregorian ISO date field</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1E2A"/><stop offset="1" stop-color="#173C53"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF951F"/><stop offset="1" stop-color="#F65D00"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#050F16" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="350" rx="18" fill="url(#navy)"/>
  <g opacity=".11" stroke="#91BACF" fill="none">
    <path d="M0 304H1200M0 268H1200M0 232H1200M0 196H1200M0 160H1200M0 124H1200M0 88H1200M0 52H1200"/>
    <path d="M72 0V350M144 0V350M216 0V350M288 0V350M360 0V350M432 0V350M504 0V350M576 0V350M648 0V350M720 0V350M792 0V350M864 0V350M936 0V350M1008 0V350M1080 0V350M1152 0V350"/>
